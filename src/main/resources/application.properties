server.port=0

# H2 file-based persistence: committed billing state survives restarts
spring.datasource.url=jdbc:h2:file:./data/billing;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Billing configuration
# 出账宽限期：窗口结束后该天数内仍可直接出账，超期窗口自动封账
billing.grace-period-days=3
# 窗口时区（窗口边界按该时区对齐到月）
billing.window-zone=UTC
# 金额运算中间精度（最终金额固定保留2位，HALF_UP）
billing.amount-scale=4
billing.final-scale=2
billing.rounding-mode=HALF_UP
# 自动封账巡检开关
billing.auto-seal-enabled=true
billing.auto-seal-cron=0 0 * * * *
